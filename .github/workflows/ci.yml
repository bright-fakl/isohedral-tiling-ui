name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch of main to deploy to the live Space (default: the selected ref). Skips the CI gate for that ref."
        required: false
        default: ""

env:
  MPLBACKEND: Agg
  # Hugging Face Spaces (Docker SDK). Change the names here only.
  HF_SPACE_LIVE: devfakl/isohedral-tiling-ui

jobs:
  lint:
    name: lint (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Install ruff
        run: uv tool install ruff==0.17.3
      - name: Ruff and ruff format against the recorded baseline
        run: ci/lint_baseline.sh
      - name: Ruff on the tests (no findings allowed)
        run: |
          ruff check --no-fix tests
          ruff format --check tests

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e . --group dev -c ci/constraints.txt
      - name: mypy (the existing findings do not block)
        run: uv run --no-sync mypy || echo "::warning::mypy reports findings (advisory; baseline 296 errors in 9 files)"

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e . --group dev -c ci/constraints.txt
      - name: pytest
        run: uv run --no-sync pytest -q

  browser:
    name: browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e . --group dev -c ci/constraints.txt
          uv pip install playwright
          uv run --no-sync playwright install --with-deps chromium
      - name: pytest (browser)
        run: uv run --no-sync pytest -q tests/browser

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from the Dockerfile
        run: docker build -t isotile-ui:ci .
      - name: Run the container and wait for the app
        run: |
          docker run -d --name app -p 7860:7860 isotile-ui:ci
          tries=0
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/app)" = "200" ]; do
            tries=$((tries + 1))
            if [ "$tries" -gt 60 ]; then
              echo "::error::the app did not answer HTTP 200 on port 7860 within 120 s"
              docker logs app
              exit 1
            fi
            if [ -z "$(docker ps -q -f name=app)" ]; then
              echo "::error::the container exited"
              docker logs app
              exit 1
            fi
            sleep 2
          done
          echo "HTTP 200 after $tries retries"
      - name: Check the log for a traceback
        run: |
          docker logs app 2>&1 | tee container.log
          if grep -q "Traceback" container.log; then
            echo "::error::the container log contains a traceback"
            exit 1
          fi
      - name: Stop the container
        if: always()
        run: docker rm -f app

  live:
    name: live Space sync
    # A push to main deploys only after every CI job has passed for that commit.
    # A manual run deploys the chosen ref without that gate (a rollback must work while main is red);
    # the ref must be in the history of main.
    if: >-
      always() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.lint.result == 'success' && needs.tests.result == 'success'
          && needs.browser.result == 'success' && needs.docker.result == 'success')
        || github.event_name == 'workflow_dispatch')
    needs: [lint, tests, browser, docker]
    runs-on: ubuntu-latest
    environment: live
    concurrency:
      group: live-space
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ inputs.ref || github.sha }}
      - name: Require the ref to be in the history of main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse HEAD) is not in the history of main"; exit 1; }
      - name: Push the snapshot to the live Space
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ci/sync_space.sh "$HF_SPACE_LIVE" "$(git rev-parse HEAD)"
      - name: Wait for the live Space to run the snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ci/wait_space.sh "$HF_SPACE_LIVE" "${{ steps.push.outputs.snapshot }}"

name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # The Space receives a single snapshot commit without the test and CI
          # files: the hub rejects the binary test fixtures.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git rm -r -q --cached tests ci
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/devfakl/isohedral-tiling-ui
          git push hf hf-deploy:main --force

[project]
name = "isohedral-tiling-ui"
version = "0.1.0"
description = "Interactive Panel/Bokeh UI for designing isohedral tilings."
authors = [{ name = "FKloosterman", email = "devfakl@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["tiling", "isohedral", "panel", "tessellation"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "isotile @ https://github.com/bright-fakl/isotile/archive/c1535fc40cd7e75d59ca45b5ddc4874daf82b87a.zip",
    "numpy>=2.2",
    "pandas>=2.3",
    "panel>=1.9",
    "param>=2.1",
    "bokeh>=3.9",
    "svgwrite>=1.4",
    "matplotlib>=3.9",
]

[project.scripts]
isohedral-tiling-ui = "isohedral_tiling_ui:launch_ui"

[project.urls]
Repository = "https://github.com/bright-fakl/isohedral-tiling-ui"
Issues = "https://github.com/bright-fakl/isohedral-tiling-ui/issues"
App = "https://devfakl-isohedral-tiling-ui.hf.space/"
isotile = "https://github.com/bright-fakl/isotile"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "mypy>=0.991",
    "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/isohedral_tiling_ui"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "panel.*",
    "param.*",
    "bokeh.*",
    "svgwrite.*",
    "matplotlib.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM",
    "I", "C90", "E", "W", "F", "PGH", "UP", "RUF", "TRY",
]
ignore = [
    "E501",
    "E731",
    "TRY003",
    "TRY301",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

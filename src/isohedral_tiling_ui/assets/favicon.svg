<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Isohedral Tiling Generator icon.
    Pointy-top hex tiling, circumradius R=32, centre (50,50).

    Vertices (R=32, centred at origin):
      V0=(0,-32)    V1=(27.7,-16)  V2=(27.7,16)
      V3=(0,32)     V4=(-27.7,16)  V5=(-27.7,-16)
    Edge length = R = 32.

    Corner rounding t=5: for each vertex Vi,
      A_in[i]  = Vi + 5*normalize(V[i-1]-Vi)
      A_out[i] = Vi + 5*normalize(V[i+1]-Vi)

    Verified anchor coords:
      A_in[0]=(-4.33,-29.5)   A_out[0]=(4.33,-29.5)
      A_in[1]=(23.37,-18.5)   A_out[1]=(27.7,-11)
      A_in[2]=(27.7,11)        A_out[2]=(23.37,18.5)
      A_in[3]=(4.33,29.5)     A_out[3]=(-4.33,29.5)
      A_in[4]=(-23.37,18.5)   A_out[4]=(-27.7,11)
      A_in[5]=(-27.7,-11)      A_out[5]=(-23.37,-18.5)

    Neighbour offsets (sqrt(3)*R=55.4, 3R/2=48):
      right (+55.4,0)  left (-55.4,0)
      top-right (+27.7,-48)  top-left (-27.7,-48)
      bot-right (+27.7,+48)  bot-left (-27.7,+48)
  -->
  <defs>
    <path id="hex"
      d="M-4.33,-29.5
         Q0,-32      4.33,-29.5
         L23.37,-18.5
         Q27.7,-16   27.7,-11
         L27.7,11
         Q27.7,16    23.37,18.5
         L4.33,29.5
         Q0,32      -4.33,29.5
         L-23.37,18.5
         Q-27.7,16  -27.7,11
         L-27.7,-11
         Q-27.7,-16 -23.37,-18.5
         Z"/>

    <clipPath id="bounds">
      <rect width="100" height="100" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bounds)">
    <!-- Background -->
    <rect width="100" height="100" fill="#ffffff"/>

    <!-- Six partially-visible neighbouring tiles -->
    <use href="#hex" transform="translate(105.4,50)"  fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
    <use href="#hex" transform="translate(-5.4,50)"   fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
    <use href="#hex" transform="translate(77.7,2)"    fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
    <use href="#hex" transform="translate(22.3,2)"    fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
    <use href="#hex" transform="translate(77.7,98)"   fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
    <use href="#hex" transform="translate(22.3,98)"   fill="#1971c2" stroke="#fff" stroke-width="2.5"/>

    <!-- Central tile (drawn last, fully on top) -->
    <use href="#hex" transform="translate(50,50)"     fill="#1971c2" stroke="#fff" stroke-width="2.5"/>
  </g>
</svg>
